<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow &amp; Fulfillment</title>
  <meta name="description" content="How the Old Testament foreshadows the New: a scroll-driven tour of biblical typology from the LogosGraph knowledge graph.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="prototype-flag" role="note">Draft: not for publication</div>

  <header class="intro">
    <p class="eyebrow">LogosGraph</p>
    <h1 id="story-title">Shadow &amp; Fulfillment</h1>
    <p class="subtitle" id="story-subtitle"></p>
    <div class="scroll-hint" aria-hidden="true">Scroll<span>↓</span></div>
  </header>

  <main class="scrolly">
    <figure class="graphic">
      <svg id="graph" role="img" aria-labelledby="graph-desc">
        <desc id="graph-desc">Network of Old Testament figures linked to their New Testament fulfillments.</desc>
      </svg>
      <div class="legend" id="legend" aria-live="polite"></div>
    </figure>
    <div class="steps" id="steps"></div>
  </main>

  <footer class="outro">
    <p>Part of <strong>LogosGraph</strong>, a knowledge graph of the 73-book Catholic Bible. See also
      <a href="https://wsovine.github.io/bible-crossrefs-visualization/">Old and New Testament arcs</a> and
      <a href="https://wsovine.github.io/bible-timeline/">the Bible timeline</a>.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/scrollama@3.2.0/build/scrollama.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
