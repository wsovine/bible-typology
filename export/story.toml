[[chapter]]
id = "explore"
title = "Explore the figures"

[[chapter.step]]
id = "explore-intro"
view = "explorer"
text = """
Now explore on your own. Search any of the {types} figures, filter by theme, and open one to see its \
links, the verses behind it, the commentators who noticed it, and what the Catechism says.
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "sources"
title = "Sources & methods"

[[chapter.step]]
id = "sources-data"
view = "text"
text = """
This site is built from LogosGraph, a knowledge graph of the 73-book Bible. Verse text is from \
the Catholic Public Domain Version. Typology links come from the Catechism of the Catholic Church and \
from the Haydock Bible commentary (first published 1811–1814, later revised), which gathers the Fathers \
and later commentators.
"""

[[chapter.step]]
id = "sources-method"
view = "text"
text = """
Every link on this site was checked against the text of its source: the Catechism paragraph or the \
commentary note that makes it.
"""

[[chapter.step]]
id = "sources-warrant"
view = "text"
text = """
Each featured pair in the story is marked by its strongest warrant: the New Testament draws the link itself, \
the Catechism teaches it, or it comes from the commentary tradition, sometimes from a single commentator. \
In the explorer, every link lists its sources.
"""

[[chapter.step]]
id = "sources-caveats"
view = "text"
text = """
The commentators wrote amid the controversies of their own centuries. Where one of their readings \
could be mistaken for Church teaching, the explorer adds a short note from Scripture or the Catechism.
"""

[[chapter.step]]
id = "sources-numbering"
view = "text"
text = """
