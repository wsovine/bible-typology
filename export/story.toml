# Typology scrollytelling: narrative script (DRAFT 2, 2026-10-16; revised after the theologian review)
#
# Hand-authored source for the story. Render a review copy with real verse/CCC text and validation:
#   NEO4J_URI=bolt://localhost:17687 python export/render_story.py   (from the site root)
#
# Step fields
#   view     visual state for the graphic: title | text | verse | web-all | web-category | pair | radial | explorer
#   text     on-screen copy (<= 60 words). {placeholders} are filled from live graph stats (see [stats]).
#            Every “quoted” fragment over two words must be real CPDV or Catechism wording.
#   pair     { type, antitype }: must be a PREFIGURES edge in the graph
#   warrant  pair badge(s): scripture (the NT draws the link itself) | catechism | tradition (commentators)
#   ot/nt    display verse IDs (Vulgate/CPDV numbering) chosen to read naturally; need not be attesting verses
#   verse    a single display verse (view = "verse")
#   quote    { text, by }: commentary quote; must appear verbatim in the Haydock commentary on that pair
#            ("…" marks an omission). `by` is the commentator.
#   ccc      { para, quote } or a list of them; each quote must appear verbatim in that paragraph

[meta]
title = "Shadow & Fulfillment"          # working title (decision D1)
subtitle = "How the Old Testament foreshadows the New"

[stats]
# Types counted as "Christ or an event of his life" for the convergence chapter
christ_family = ["christ", "christs-passion", "the-resurrection", "christs-victory", "christ-high-priest",
                 "christs-ascension", "the-betrayal-by-judas"]

[labels]
# Display-name overrides (the graph keeps its own names)
the-one-true-church = "The Church"

# ---------------------------------------------------------------------------
[[chapter]]
id = "intro"
title = "What is a type?"

[[chapter.step]]
id = "intro-title"
view = "title"
verse = "HEB-10-1"
text = """
“The law contains the shadow of future good things,” says the Letter to the Hebrews. For two thousand \
years Christians have read the Old Testament this way: as a true story whose people, events and rituals \
cast shadows forward onto Christ and his Church.
"""

[[chapter.step]]
id = "intro-saying"
view = "text"
ccc = { para = 129, quote = "the New Testament lies hidden in the Old and the Old Testament is unveiled in the New" }
text = """
A saying of Saint Augustine, quoted by the Catechism, puts it simply: the New Testament lies hidden in \
the Old, and the Old is unveiled in the New. Reading Scripture this way is called typology.
"""

[[chapter.step]]
id = "intro-word"
view = "pair"
pair = { type = "adam", antitype = "christ" }
warrant = ["scripture", "catechism"]
ot = "GEN-2-7"
nt = "ROM-5-14"
quote = { text = "that the creature might go before in figure, and the Son of God might follow after in reality", by = "St. Ambrose" }
ccc = { para = 504, quote = "he is the New Adam, who inaugurates the new creation" }
text = """
The word comes from Scripture itself. Saint Paul calls Adam “a figure of him who was to come.” His Greek \
word is typos. A type is a real person, event or institution that foreshadows a greater fulfillment, \
called its antitype. Adam's antitype is Christ, who brings life where Adam brought death.
"""

[[chapter.step]]
id = "intro-example"
view = "pair"
pair = { type = "passover", antitype = "christs-passion" }
warrant = ["scripture", "catechism"]
ot = "EXO-12-46"
nt = "JHN-19-36"
quote = { text = "This, which was literally spoken of the paschal lamb, … the evangelist applies to Christ, of whom the lamb was a figure.", by = "Witham" }
ccc = { para = 1096, quote = "the Passover fulfilled in the death and Resurrection of Christ" }
text = """
Here is one. At the first Passover, Israel was told to eat a lamb without breaking any of its bones. At \
the crucifixion, soldiers broke the legs of the men beside Jesus, but not his. John saw the connection: \
Jesus is the Passover Lamb.
"""

[[chapter.step]]
id = "intro-value"
view = "text"
ccc = { para = 129, quote = "the Old Testament retains its own intrinsic value as Revelation reaffirmed by our Lord himself" }
text = """
A type is not a coincidence or a clever code. The Catechism insists that the Old Testament “retains its \
own intrinsic value,” and that “the New Testament has to be read in the light of the Old.” The figure has \
its own meaning. But it points beyond itself, and the fulfillment is always greater.
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "web"
title = "A web of figures"

[[chapter.step]]
id = "web-all"
view = "web-all"
text = """
LogosGraph maps {types} of these figures and {links} links between them. They are drawn from the \
Catechism of the Catholic Church and from the 19th-century Haydock Bible commentary, which gathers \
readings from the Church Fathers and later Catholic commentators. Old Testament figures sit on one side; \
their fulfillments, on the other.
"""

[[chapter.step]]
id = "web-categories"
view = "web-category"
text = """
Each link has a theme: Christ himself, the Church, the end of time, the sacraments, Mary, or the \
covenants. Let's follow four of these threads.
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "waters"
title = "Through the Waters"
category = "Sacramental"

[[chapter.step]]
id = "waters-intro"
view = "web-category"
ccc = { para = 1217, quote = "the Church solemnly commemorates the great events in salvation history that already prefigured the mystery of Baptism" }
text = """
Every Easter Vigil, as the Church blesses the water for Baptism, she recalls great moments of salvation \
history that already prefigured it. The Catechism walks through them one by one.
"""

[[chapter.step]]
id = "waters-flood"
view = "pair"
pair = { type = "noahs-ark", antitype = "baptism" }
warrant = ["scripture", "catechism"]
ot = "GEN-7-23"
nt = "1PE-3-21"
quote = { text = "the ark was a figure of baptism, which saveth you from the death of the soul", by = "Haydock commentary" }
ccc = { para = 1219, quote = "The Church has seen in Noah's ark a prefiguring of salvation by Baptism" }
text = """
The Flood. The waters that ended a corrupt world also carried eight people to safety in the ark. Saint \
Peter makes the link explicit: Baptism now saves you “in a similar manner.” His Greek word is antitypos, \
“corresponding to,” from which we get “antitype.”
"""

[[chapter.step]]
id = "waters-red-sea"
view = "pair"
pair = { type = "red-sea-crossing", antitype = "baptism" }
warrant = ["scripture", "catechism"]
ot = "EXO-14-22"
nt = "1CO-10-2"
quote = { text = "This is a figure of baptism, in which the fruits of Christ's blood are applied to our souls. All sins are there destroyed, as the Egyptians were in the Sea.", by = "St. Augustine, via Worthington" }
ccc = { para = 1221, quote = "the crossing of the Red Sea, literally the liberation of Israel from the slavery of Egypt, announces the liberation wrought by Baptism" }
text = """
The Red Sea. Israel walked out of slavery between walls of water, and the army pursuing them drowned. \
Paul says they were all “baptized, in the cloud and in the sea.” Liberation from Egypt becomes the \
pattern for liberation from sin.
"""

[[chapter.step]]
id = "waters-jordan"
view = "pair"
pair = { type = "jordan-crossing", antitype = "baptism" }
warrant = ["catechism"]
ot = "JOS-3-17"
nt = "MAT-3-16"
ccc = { para = 1222, quote = "Baptism is prefigured in the crossing of the Jordan River by which the People of God received the gift of the land promised to Abraham's descendants, an image of eternal life" }
text = """
The Jordan. Forty years after the Red Sea, Israel crossed the Jordan River on dry ground into the \
Promised Land, which the Catechism calls “an image of eternal life.” Their leader was Joshua, a name that \
in Greek is Jesus. Centuries later, Jesus was baptized in the same river, and the heavens opened.
"""

[[chapter.step]]
id = "waters-circumcision"
view = "pair"
pair = { type = "circumcision", antitype = "baptism" }
warrant = ["scripture", "catechism"]
ot = "GEN-17-11"
nt = "COL-2-12"
quote = { text = "to be a figure of baptism", by = "Menochius and Tirinus" }
ccc = { para = 527, quote = "This sign prefigures that \"circumcision of Christ\" which is Baptism." }
text = """
Circumcision. One figure of Baptism involves no water. God's covenant with Abraham was marked on every \
male child eight days after birth, Jesus included. Paul speaks of “a circumcision not made by hand… the \
circumcision of Christ,” and in the next breath of being “buried with him in baptism.”
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "bread"
title = "Bread from Heaven"
category = "Sacramental"

[[chapter.step]]
id = "bread-intro"
view = "web-category"
text = """
A second sacramental thread runs through meals: a lamb eaten in haste, bread falling from the sky, a \
mysterious priest-king's offering. Each one, the Church teaches, points toward the Eucharist.
"""

[[chapter.step]]
id = "bread-passover"
view = "pair"
pair = { type = "passover", antitype = "eucharist" }
warrant = ["catechism"]
ot = "EXO-12-14"
nt = "LUK-22-19"
ccc = { para = 1363, quote = "every time Passover is celebrated, the Exodus events are made present to the memory of believers" }
text = """
Passover. Israel was commanded to keep the Passover “as a memorial” forever. On the night before he \
died, at the Passover meal, Jesus took bread and said: “Do this as a commemoration of me.”
"""

[[chapter.step]]
id = "bread-manna"
view = "pair"
pair = { type = "manna", antitype = "eucharist" }
warrant = ["scripture", "catechism"]
ot = "EXO-16-4"
nt = "JHN-6-51"
quote = { text = "was a figure of the bread of life, which we receive in the blessed sacrament, for the food and nourishment of our souls, during the time of our mortal pilgrimage", by = "Challoner" }
ccc = { para = 1094, quote = "manna in the desert prefigured the Eucharist, \"the true bread from heaven.\"" }
text = """
Manna. For forty years in the desert, God fed his people with bread from heaven. When the crowd recalled \
it, Jesus answered: “I am the living bread, who descended from heaven.”
"""

[[chapter.step]]
id = "bread-melchizedek"
view = "pair"
pair = { type = "melchizedek", antitype = "eucharist" }
warrant = ["catechism", "tradition"]
ot = "GEN-14-18"
nt = "MAT-26-26"
quote = { text = "Melchisedech offered not bloody victims, but dedicated the sacrament of Christ in bread and wine", by = "St. Jerome" }
ccc = { para = 1333, quote = "The Church sees in the gesture of the king-priest Melchizedek, who \"brought out bread and wine,\" a prefiguring of her own offering." }
text = """
Melchizedek. A king of Salem and “a priest of the Most High God” appears from nowhere to bless Abraham, \
bringing out bread and wine. The Church sees in his gesture “a prefiguring of her own offering.”
"""

[[chapter.step]]
id = "bread-other-sacraments"
view = "web-category"
text = """
Other sacraments have figures too. The Church sees in Aaron's priesthood, the Levites and the seventy \
elders “a prefiguring of the ordained ministry.” Anointed kings and priests point to Confirmation, God's \
marriage covenant with Israel to Matrimony, and the old law's confession of sin to Penance. The Anointing \
of the Sick first appears in the New Testament (James 5:14).
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "christ"
title = "Figures of Christ"
category = "Christological"

[[chapter.step]]
id = "christ-intro"
view = "web-category"
text = """
The largest thread is about Christ himself: figures that foreshadow who Jesus is and what he would \
suffer. Here are six of them.
"""

[[chapter.step]]
id = "christ-isaac"
view = "pair"
pair = { type = "binding-of-isaac", antitype = "christs-passion" }
warrant = ["catechism", "tradition"]
ot = "GEN-22-6"
nt = "JHN-19-17"
quote = { text = "Isaac, carrying the wood on his shoulders for the sacrifice, was a figure of Jesus Christ carrying his cross.", by = "Haydock commentary" }
ccc = { para = 2572, quote = "the Father who will not spare his own Son but will deliver him up for us all" }
text = """
Isaac. God asked Abraham for “your only begotten son Isaac, whom you love.” Isaac carried the wood up the \
mountain, and Abraham told him: “God himself will provide the victim.” Isaac was spared; a ram died in his \
place. Centuries later, Jesus carried his own cross to Calvary.
"""

[[chapter.step]]
id = "christ-joseph"
view = "pair"
pair = { type = "joseph", antitype = "christ" }
warrant = ["tradition"]
ot = "GEN-50-20"
nt = "ROM-5-20"
quote = { text = "His greatest glory was, to have prefigured Jesus Christ in so wonderful a manner during the course of his life", by = "Haydock commentary" }
ccc = { para = 312, quote = "From the greatest moral evil ever committed" }
text = """
Joseph. Sold by his jealous brothers for twenty pieces of silver, he rose to save Egypt and his own \
family from famine. “You devised evil against me,” he told them. “But God turned it into good.” The \
Catechism sets this beside the Cross: from the greatest evil ever committed, God brought the greatest good.
"""

[[chapter.step]]
id = "christ-serpent"
view = "pair"
pair = { type = "brazen-serpent", antitype = "christs-passion" }
warrant = ["scripture", "catechism"]
ot = "NUM-21-9"
nt = "JHN-3-14"
quote = { text = "he does not consider the cross as a disgrace, but as a glory", by = "Theophylactus and St. Chrysostom" }
ccc = { para = 2130, quote = "God ordained or permitted the making of images that pointed symbolically toward salvation by the incarnate Word: so it was with the bronze serpent" }
text = """
The bronze serpent. Bitten by poisonous snakes in the desert, the Israelites were healed by looking at a \
bronze serpent Moses set up as a sign. Wisdom adds that each one “was not healed by what he saw, but by \
you, the Savior of all.” Jesus applied it to himself: “so also must the Son of man be lifted up.”
"""

[[chapter.step]]
id = "christ-david"
view = "pair"
pair = { type = "david", antitype = "christs-passion" }
warrant = ["tradition"]
ot = "2SA-18-33"
nt = "LUK-23-34"
quote = { text = "In this he was a figure of Christ weeping, praying, and dying for his rebellious children, and even for them that crucified him.", by = "Challoner, with St. Ambrose and Theodoret" }
text = """
David. Betrayed by his own son Absalom, Israel's shepherd-king still wept when the young man died: “Who \
can grant to me that I may die on your behalf?” The commentators saw a figure of Christ, who prayed even \
for those crucifying him: “Father, forgive them. For they know not what they do.”
"""

[[chapter.step]]
id = "christ-jonah"
view = "pair"
pair = { type = "jonah", antitype = "the-resurrection" }
warrant = ["scripture", "catechism"]
ot = "JON-2-1"
nt = "MAT-12-40"
quote = { text = "who would have thought that Jonas had been a figure of our Saviour's death and resurrection, if he himself had not declared it?", by = "Worthington" }
ccc = { para = 994, quote = "He speaks of this unique event as the \"sign of Jonah,\" the sign of the temple: he announces that he will be put to death but rise thereafter on the third day." }
text = """
Jonah. Three days and three nights in the belly of a great fish, then back into the light. Asked for a \
sign, Jesus offered only this one: “so shall the Son of man be in the heart of the earth for three days \
and three nights.”
"""

[[chapter.step]]
id = "christ-melchizedek"
view = "pair"
pair = { type = "melchizedek", antitype = "christ-high-priest" }
warrant = ["scripture", "catechism"]
ot = "PSA-109-4"
nt = "HEB-7-17"
ccc = { para = 1544, quote = "The Christian tradition considers Melchizedek, \"priest of God Most High,\" as a prefiguration of the priesthood of Christ" }
text = """
Melchizedek again, where type and prophecy meet. Genesis gives the figure; a psalm then promises a king \
who will be “a priest forever, according to the order of Melchizedek.” Hebrews applies both to Jesus: a \
priest not by descent from Levi, but “according to the virtue of an indissoluble life.”
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "mary"
title = "Daughters of Promise"
category = "Marian"

[[chapter.step]]
id = "mary-intro"
view = "web-category"
ccc = { para = 64, quote = "kept alive the hope of Israel's salvation. The purest figure among them is Mary." }
text = """
The Catechism names Old Testament women who “kept alive the hope of Israel's salvation”: Sarah, Hannah, \
Deborah, Judith, Esther and others. “The purest figure among them is Mary.” Throughout the Old Covenant, \
the Catechism teaches, “the mission of many holy women prepared for that of Mary.”
"""

[[chapter.step]]
id = "mary-eve"
view = "pair"
pair = { type = "eve", antitype = "mary" }
warrant = ["catechism", "tradition"]
ot = "GEN-3-20"
nt = "LUK-1-38"
quote = { text = "one who imparts life, in which she was a figure of the blessed Virgin Mary", by = "Calmet" }
ccc = { para = 494, quote = "The knot of Eve's disobedience was untied by Mary's obedience" }
text = """
Eve. Despite her disobedience, the Catechism notes, Eve received God's promise and the name “the mother \
of all the living.” Mary answered the angel: “Let it be done to me according to your word.” Early Fathers \
such as Saint Irenaeus called Mary the new Eve, whose obedience untied “the knot of Eve's disobedience.”
"""

[[chapter.step]]
id = "mary-sarah"
view = "pair"
pair = { type = "sarah", antitype = "mary" }
warrant = ["catechism"]
ot = "GEN-18-14"
nt = "LUK-1-37"
quote = { text = "who was a figure of the blessed Virgin Mary, and of the Church", by = "Calmet" }
ccc = { para = 489, quote = "By virtue of this promise, Sarah conceives a son in spite of her old age." }
text = """
Sarah. Long past the age of childbearing, she laughed when told she would have a son. God's reply: “Is \
anything difficult for God?” When the angel tells Mary she will conceive by the Holy Spirit, he gives the \
same answer: “For no word will be impossible with God.”
"""

[[chapter.step]]
id = "mary-hannah"
view = "pair"
pair = { type = "hannah", antitype = "mary" }
warrant = ["catechism", "tradition"]
ot = "1SA-2-7"
nt = "LUK-1-52"
quote = { text = "The blessed Virgin conveys the same idea in other words", by = "Menochius" }
ccc = { para = 489, quote = "Hannah, the mother of Samuel" }
text = """
Hannah. Childless and taunted, she prayed for a son and was given Samuel. Her song of thanks praises a \
God who reverses fortunes: “He humbles, and he lifts up.” A thousand years later, Mary's Magnificat sings \
the same: “He has deposed the powerful from their seat, and he has exalted the humble.”
"""

[[chapter.step]]
id = "mary-ark"
view = "pair"
pair = { type = "the-ark-of-the-covenant", antitype = "mary" }
warrant = ["catechism"]
ot = "2SA-6-9"
nt = "LUK-1-43"
ccc = { para = 2676, quote = "the ark of the covenant, the place where the glory of the Lord dwells" }
text = """
The Ark of the Covenant was where God's glory dwelt. David asked, “How shall the ark of the Lord be \
brought to me?” and it stayed three months in a house that was blessed. Many readers hear Luke echoing \
this: Elizabeth asks how “the mother of my Lord” could come to her, and Mary stays about three months.
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "church"
title = "One Ark, One People"
category = "Ecclesial"

[[chapter.step]]
id = "church-intro"
view = "web-category"
text = """
The Fathers also saw in Israel's story the shape of the Church: a people gathered, sheltered and built \
into a dwelling for God. Paul's image is not replacement but grafting: the nations are joined to Israel's \
own olive tree, where “the root supports you.” {ecclesial} links follow this thread.
"""

[[chapter.step]]
id = "church-ark"
view = "pair"
pair = { type = "noahs-ark", antitype = "the-one-true-church" }
warrant = ["catechism", "tradition"]
ot = "GEN-7-1"
nt = "1PE-3-20"
ccc = { para = 845, quote = "According to another image dear to the Church Fathers, she is prefigured by Noah's ark" }
text = """
Noah's Ark. The ark that prefigures Baptism also became one of the Church's oldest images of herself: a \
vessel carrying a family through the flood. The “nave” of a church takes its name from the Latin navis, \
ship.
"""

[[chapter.step]]
id = "church-temple"
view = "pair"
pair = { type = "the-temple-of-jerusalem", antitype = "the-one-true-church" }
warrant = ["scripture", "catechism"]
ot = "1KI-8-11"
nt = "EPH-2-21"
quote = { text = "was fulfilled in the Church of Jesus Christ", by = "Haydock commentary" }
ccc = { para = 756, quote = "As living stones we here on earth are built into it." }
text = """
The Temple. When Solomon dedicated it, the glory of the Lord filled the house so completely that the \
priests could not stand. Jesus, John explains, “was speaking about the Temple of his body,” and Paul tells \
the first Christians that in him they are rising “into a holy temple in the Lord.”
"""

[[chapter.step]]
id = "church-twelve"
view = "pair"
pair = { type = "the-twelve-patriarchs", antitype = "the-twelve-apostles" }
warrant = ["scripture", "catechism"]
ot = "GEN-49-28"
nt = "REV-21-14"
quote = { text = "that they might correspond to the number of the Jewish patriarchs, by whom they may be said to have been prefigured", by = "Menochius" }
ccc = { para = 765, quote = "Representing the twelve tribes of Israel, they are the foundation stones of the new Jerusalem." }
text = """
The Twelve. Israel grew from the twelve sons of Jacob; Jesus chose twelve apostles. In Revelation, the \
heavenly city has twelve gates named for the tribes of Israel and twelve foundations bearing the names of \
the apostles.
"""

[[chapter.step]]
id = "church-rahab"
view = "pair"
pair = { type = "rahab", antitype = "the-gentiles-grafted-into-christs-church" }
warrant = ["tradition"]
ot = "JOS-6-25"
nt = "EPH-2-19"
quote = { text = "Rahab prefigured the wild olive tree, which St. Paul says was engrafted on the good olive tree", by = "Theodoret" }
text = """
Rahab. A Canaanite woman of Jericho sheltered Israel's spies and lived among God's people from then on; \
Matthew names her among Jesus' ancestors. The Fathers saw in her the nations welcomed in: “no longer \
visitors,” Paul writes, but “citizens among the saints.”
"""

[[chapter.step]]
id = "church-marriage"
view = "pair"
pair = { type = "adam-and-eve", antitype = "christ-church" }
warrant = ["scripture", "catechism"]
ot = "GEN-2-24"
nt = "EPH-5-32"
quote = { text = "the mystery of Christ's union with his church for ever, prefigured by this indissoluble marriage of our first parents", by = "Calmet" }
ccc = { para = 766, quote = "As Eve was formed from the sleeping Adam's side, so the Church was born from the pierced heart of Christ hanging dead on the cross." }
text = """
Marriage. “The two shall be as one flesh,” Genesis says, right after the creation of the first couple. \
Paul quotes the line, then adds: “This is a great Sacrament. And I am speaking in Christ and in the \
Church.” His Greek word is mystērion, “mystery”: the union of husband and wife reflects Christ's love for \
his Church.
"""

# ---------------------------------------------------------------------------
[[chapter]]
id = "convergence"
title = "Christ at the center"

[[chapter.step]]
id = "convergence-gather"
view = "radial"
text = """
Step back and the pattern is clear. Of the {links} links, {christLinks} point to Christ or to an event \
of his life, such as his passion, resurrection and priesthood. That is more than any other fulfillment.
"""

[[chapter.step]]
id = "convergence-close"
view = "radial"
ccc = { para = 130, quote = "Typology indicates the dynamic movement toward the fulfillment of the divine plan when \"God [will] be everything to everyone.\"" }
text = """
That is the point of typology. It does not flatten the Old Testament into a code: the patriarchs and the \
Exodus keep their own value. It shows one story, moving toward one end, when, as Paul writes, “God may be \
all in all.”
"""

